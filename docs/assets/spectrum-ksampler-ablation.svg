<svg xmlns="http://www.w3.org/2000/svg" width="920" height="500" viewBox="0 0 920 500" role="img" aria-labelledby="title desc">
  <title id="title">Spectrum KSampler warm generation time</title>
  <desc id="desc">Grouped bar chart comparing Spectrum OFF and ON median warm generation time for OFF to ON and ON to OFF execution orders.</desc>
  <rect width="920" height="500" fill="white"/>
  <text x="460" y="42" text-anchor="middle" font-family="system-ui, sans-serif" font-size="24" font-weight="700" fill="#111">Spectrum KSampler warm generation time</text>
  <text x="460" y="70" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#555">Median warm generation time across three sessions · lower is better</text>

  <line x1="110" y1="410" x2="860" y2="410" stroke="#222" stroke-width="1.5"/>
  <line x1="110" y1="110" x2="110" y2="410" stroke="#222" stroke-width="1.5"/>

  <g font-family="system-ui, sans-serif" font-size="13" fill="#555">
    <line x1="110" y1="347.5" x2="860" y2="347.5" stroke="#ddd"/><text x="95" y="352" text-anchor="end">50</text>
    <line x1="110" y1="285" x2="860" y2="285" stroke="#ddd"/><text x="95" y="289.5" text-anchor="end">100</text>
    <line x1="110" y1="222.5" x2="860" y2="222.5" stroke="#ddd"/><text x="95" y="227" text-anchor="end">150</text>
    <line x1="110" y1="160" x2="860" y2="160" stroke="#ddd"/><text x="95" y="164.5" text-anchor="end">200</text>
    <text x="68" y="260" transform="rotate(-90 68 260)" text-anchor="middle">Warm generation time (s)</text>
  </g>

  <!-- Scale: 1.25 px per second, baseline y=410 -->
  <g font-family="system-ui, sans-serif">
    <rect x="230" y="157.1" width="105" height="252.9" rx="3" fill="#3f3f46"/>
    <rect x="350" y="287.7" width="105" height="122.3" rx="3" fill="#a1a1aa"/>
    <text x="282.5" y="146" text-anchor="middle" font-size="14" font-weight="600" fill="#222">202.3s</text>
    <text x="402.5" y="276.5" text-anchor="middle" font-size="14" font-weight="600" fill="#222">97.8s</text>

    <rect x="560" y="144.9" width="105" height="265.1" rx="3" fill="#3f3f46"/>
    <rect x="680" y="270.5" width="105" height="139.5" rx="3" fill="#a1a1aa"/>
    <text x="612.5" y="133.8" text-anchor="middle" font-size="14" font-weight="600" fill="#222">212.1s</text>
    <text x="732.5" y="259.3" text-anchor="middle" font-size="14" font-weight="600" fill="#222">111.6s</text>

    <text x="342.5" y="442" text-anchor="middle" font-size="15" fill="#222">OFF → ON</text>
    <text x="672.5" y="442" text-anchor="middle" font-size="15" fill="#222">ON → OFF</text>
  </g>

  <g font-family="system-ui, sans-serif" font-size="13" fill="#333">
    <rect x="334" y="468" width="16" height="16" rx="2" fill="#3f3f46"/><text x="358" y="481">Spectrum OFF</text>
    <rect x="474" y="468" width="16" height="16" rx="2" fill="#a1a1aa"/><text x="498" y="481">Spectrum ON</text>
  </g>
</svg>
