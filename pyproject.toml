[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "comfy-metal-lab"
version = "0.0.1"
description = "Reproducible ComfyUI inference benchmarking and optimization for Apple Silicon."
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "pillow>=11",
    "scikit-image>=0.25",
]

[project.scripts]
comfy-metal = "comfy_metal.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/comfy_metal"]

[tool.hatch.build.targets.sdist]
exclude = [
    "/_local",
    "/dist",
    "/build",
]
